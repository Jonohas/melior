services:
  postgres:
    image: postgres:17
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: melior
      POSTGRES_USER: pg
      POSTGRES_PASSWORD: mypassword
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pg -d melior"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  jaeger:
    image: cr.jaegertracing.io/jaegertracing/jaeger:2.14.0
    container_name: jaeger
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC receiver
      - "4318:4318"    # OTLP HTTP receiver
      - "5778:5778"    # Zipkin compact thrift
      - "9411:9411"    # Zipkin HTTP
    restart: unless-stopped
    
  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  coturn:
    image: coturn/coturn:4.6.2
    container_name: coturn
    restart: unless-stopped
    ports:
      - "3478:3478"
      - "3478:3478/udp"
      - "5349:5349"
      - "5349:5349/udp"
      - "49152-49160:49152-49160/udp" # Small range for Mac testing
    volumes:
        - ./turnserver.conf:/etc/coturn/turnserver.conf:ro
        - ./cert.pem:/etc/coturn/certs/cert.pem:ro
        - ./privkey.pem:/etc/coturn/certs/privkey.pem:ro

volumes:
  postgres_data: