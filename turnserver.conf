listening-port=3478
tls-listening-port=5349
cert=/etc/coturn/certs/cert.pem
pkey=/etc/coturn/certs/privkey.pem
realm=localhost
user=username:password
lt-cred-mech

# macOS specific: Use the internal Docker IP or 127.0.0.1 
# for local loopback testing
external-ip=127.0.0.1

# Match the port range in docker-compose
min-port=49152
max-port=49160

log-file=stdout
verbose
no-ipv6