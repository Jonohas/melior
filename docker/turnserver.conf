# coturn configuration.
#
# Time-limited credentials (TURN REST API): the SFU derives a username
# "<expiry>:<name>" and an HMAC credential from a shared secret. The secret and
# the realm and external IP are NOT set here; docker-compose.yaml passes
# --static-auth-secret, --realm and --external-ip from docker/.env.

listening-port=3478
use-auth-secret

# Relay port range; must match the range published in docker-compose.yaml.
# Every participant needs at least one relay port (browsers may allocate one
# per network interface), so keep this comfortably larger than the room size.
min-port=49152
max-port=49451

# A browser that disappears without saying goodbye leaves its relay ports
# allocated until they time out. Capped well below coturn's default so they
# come back quickly; live clients refresh long before this.
max-allocate-lifetime=180

# TLS is disabled by default so that a fresh checkout works without
# certificates. To enable it: put cert.pem and privkey.pem into docker/certs/
# (or point COTURN_CERT_DIR at another folder), delete the two "no-" lines
# below and uncomment the tls-listening-port/cert/pkey lines.
no-tls
no-dtls
#tls-listening-port=5349
#cert=/etc/coturn/certs/cert.pem
#pkey=/etc/coturn/certs/privkey.pem

log-file=stdout
verbose
